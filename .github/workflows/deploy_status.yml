name: Deploy Status

on:
  pull_request_target:
    branches:
      - master
    types: [opened, labeled, synchronize]
  issues:
    types: [labeled, closed]

# The action authenticates as the Deploy Status GitHub App, so the workflow
# token is only used to check out the action
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # For pull_request_target this checks out the base branch, so the job runs
      # the action that is already on master and never code from the pull
      # request. Do not add a ref, and do not change the trigger to
      # pull_request: the next step has the GitHub App's private key.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy Status Action
        uses: ./
        env:
          CLIENT_ID: ${{ secrets.DEPLOY_STATUS_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DEPLOY_STATUS_PRIVATE_KEY }}
          AIRBRAKE_KEY: ${{ secrets.GH_AIRBRAKE_KEY }}
