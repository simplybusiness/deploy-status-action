name: Rebuild dist

# Rebuilds dist/ on a pull request branch and pushes the result back to it.
# Runs automatically on Dependabot PRs that change dependencies, and can be
# run by hand for any PR from the Actions tab.
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of the pull request to rebuild dist for"
        required: true
        type: number

permissions: {}

concurrency:
  group: rebuild-dist-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # Runs the freshly bumped dependency code, so it only gets a read-only token.
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Find the pull request branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if [ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull request ${PR_NUMBER} comes from a fork"
            exit 1
          fi
          echo "head_ref=$(jq -r .head.ref <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: npm ci
        run: npm ci
      - name: Build dist
        run: |
          rm -rf dist
          npm run build
      - name: Record build details
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          jq -n \
            --arg head_ref "$HEAD_REF" \
            --arg head_sha "$HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            '{head_ref: $head_ref, head_sha: $head_sha, pr_number: $pr_number}' \
            > build-info.json
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload build details
        uses: actions/upload-artifact@v7
        with:
          name: build-info
          path: build-info.json
          if-no-files-found: error
          retention-days: 1
